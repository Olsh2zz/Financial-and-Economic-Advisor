# Файл: pages.yml
# Назначение: при каждом изменении в main собирает программу на C++, запускает
# тесты и выкладывает папку miniapp на GitHub Pages. Telegram открывает
# мини-приложение только по HTTPS, и Pages даёт такой адрес бесплатно.

name: Тесты и публикация мини-приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и тесты C++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты мини-приложения
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
      - id: deployment
        uses: actions/deploy-pages@v4
