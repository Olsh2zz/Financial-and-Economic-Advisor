# Файл: pages.yml
# Назначение: выкладывает папку miniapp на GitHub Pages после каждого
# изменения в main. Telegram открывает мини-приложение только по HTTPS,
# и Pages даёт такой адрес бесплатно.

name: Публикация мини-приложения

on:
  push:
    branches: [main]
    paths: ['miniapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
      - id: deployment
        uses: actions/deploy-pages@v4
